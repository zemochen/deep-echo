[package]
name = "deepecho"
version = "0.1.0"
description = "DeepEcho - Real-time Voice AI Assistant"
authors = ["DeepEcho Team"]
license = "MIT"
repository = "https://github.com/yourusername/deepecho"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [
  "shell-open",
  "dialog-open",
  "dialog-save",
  "fs-create-dir",
  "fs-exists",
  "fs-read-dir",
  "fs-read-file",
  "fs-remove-file",
  "fs-write-file",
  "notification-all",
  "path-all",
  "process-exit",
  "process-relaunch"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
